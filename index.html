<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheldon AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="sidebar" id="sidebar">
    <button class="new-btn" onclick="newChat()">+ New Chat</button>
    <p class="side-title">Chat History</p>
    <div id="historyList"></div>
    <div class="side-bottom">
      <b>Sheldon AI</b>
      <small>Smart • Fast • Remembers You</small>
      <button class="clear-btn" onclick="clearAll()">Clear All Chats</button>
    </div>
  </div>

  <div class="main">
    <div class="top">
      <button class="menu" onclick="toggleSidebar()">☰</button>
      <b>Sheldon AI</b>
      <span>● Online</span>
    </div>

    <div id="chat-box" class="chat-box"></div>

    <div class="suggest" id="suggest">
      <button onclick="askThis('Solve 2x + 5 = 15 step by step')">📐 Solve Maths</button>
      <button onclick="askThis('Explain photosynthesis for JSS2')">🧬 Science</button>
      <button onclick="askThis('Who was Moses in CRS? Explain with lesson')">✝️ CRS</button>
      <button onclick="askThis('What is a metaphor? Give examples')">📚 Literature</button>
    </div>

    <div class="input-area">
      <input id="userInput" placeholder="Ask Sheldon anything..." onkeypress="if(event.key==='Enter') sendMsg()">
      <button id="sendBtn" onclick="sendMsg()">➤</button>
    </div>
    <p class="note">Sheldon AI can make mistakes. Check important info.</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
